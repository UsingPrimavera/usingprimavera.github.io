title: Using Primavera
tagline: Oracle Primavera P6, Unifier, and Oracle Analytics Server — by practitioners, for practitioners
description: >-
  Structured technical documentation and practical insights for Oracle Primavera P6,
  Primavera Unifier, Oracle Analytics Server, and BI Publisher. Written by Barrie Callender,
  a project management systems consultant with 30+ years of experience.
author:
  name: Barrie Callender
  email: barrie@usingprimavera.com
  linkedin: https://www.linkedin.com/in/barriecallender/
theme: just-the-docs

url: https://usingprimavera.com
baseurl: ""

# set language for site
# default is 'en-US'
lang: en-GB

# Set a path/url to a logo that will be displayed instead of the title
# logo: "/assets/images/logo_50x35.png"

# Set a path/url to a favicon that will be displayed by the browser
favicon_ico: "/assets/images/favicon.ico"

# Enable or disable the site search
# Supports true (default) or false
search_enabled: true

search:
  # Split pages into sections that can be searched individually
  # Supports 1 - 6, default: 2
  heading_level: 2
  # Maximum amount of previews per search result
  # Default: 3
  previews: 3
  # Maximum amount of words to display before a matched word in the preview
  # Default: 5
  preview_words_before: 5
  # Maximum amount of words to display after a matched word in the preview
  # Default: 10
  preview_words_after: 10
  # Set the search token separator
  # Default: /[\s\-/]+/
  # Example: enable support for hyphenated search words
  tokenizer_separator: /[\s/]+/
  # Display the relative url in search results
  # Supports true (default) or false
  rel_url: true
  # Enable or disable the search button that appears in the bottom right corner of every page
  # Supports true or false (default)
  button: false
  # Focus the search input by pressing `ctrl + focus_shortcut_key` (or `cmd + focus_shortcut_key` on macOS)
  focus_shortcut_key: 'k'

mermaid:
  # Version of mermaid library
  # Pick an available version from https://cdn.jsdelivr.net/npm/mermaid/
  version: "11.9.0"

aux_links:
  Oracle Primavera documentation: https://docs.oracle.com/en/industries/construction-engineering/index.html
  Oracle Analytics Server documenttaion: https://docs.oracle.com/en/middleware/bi/analytics-server/index.html

# Makes Aux links open in a new tab. Default is false
aux_links_new_tab: false

# Enable or disable the side/mobile menu globally
# Nav menu can also be selectively enabled or disabled using page variables or the minimal layout
nav_enabled: true

# Heading anchor links appear on hover over h1-h6 tags in page content
# allowing users to deep link to a particular heading on a page.
#
# Supports true (default) or false
heading_anchors: true

# Footer content
# appears at the bottom of every page's main content
# Note: The footer_content option is deprecated and will be removed in a future major release. Please use
# `_includes/footer_custom.html` for more robust markup / liquid-based content.
footer_content: "Copyright &copy; 2025 Barrie Callender. Distributed by an <a href=\"https://github.com/UsingPrimavera/usingprimavera.github.io/tree/master/LICENSE.txt\">MIT license.</a>"

# Footer last edited timestamp
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%e %b %Y at %I:%M %p" # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html

# Footer "Edit this page on GitHub" link text
gh_edit_link: false # show or hide edit this page link
gh_edit_link_text: "Edit this page on GitHub."
gh_edit_repository: "https://github.com/UsingPrimavera/usingprimavera.github.io" # the github URL for your repo
gh_edit_branch: "source" # the branch that your docs is served from
# gh_edit_source: docs # the source that your files originate from
gh_edit_view_mode: "tree" # "tree" or "edit" if you want the user to jump into the editor immediately


# Color scheme supports "light" (default) and "dark"
color_scheme: dark

# Define Jekyll collections
collections:
  # collection "tutorials" reside in the "_tutorials" directory
  # output: false hides collections until content is ready — change to true to publish
  tutorials:
    permalink: "/:collection/:path/"
    output: false
  how-to-guides:
    permalink: "/:collection/:path/"
    output: false
  explanations:
    permalink: "/:collection/:path/"
    output: false
  references:
    permalink: "/:collection/:path/"
    output: false

just_the_docs:
  # Define which collections are used in just-the-docs
  collections:
    tutorials:
      name: Tutorials
    how-to-guides:
      name: How-To Guides
    explanations:
      name: Explanation
    references:
      name: Reference

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-compose

# Blog posts settings
show_excerpts: true

# jekyll-paginate-v2 configuration
pagination:
  enabled: true
  per_page: 10
  permalink: "/blog/page/:num/"
  title: "Blog — page :num"
  sort_field: "date"
  sort_reverse: true

# Front matter defaults
defaults:
  # Documentation collections
  - scope:
      path: ""
      type: "tutorials"
    values:
      layout: "default"
      diataxis_type: "tutorial"
      nav_exclude: false
  - scope:
      path: ""
      type: "how-to-guides"
    values:
      layout: "default"
      diataxis_type: "how-to"
      nav_exclude: false
  - scope:
      path: ""
      type: "explanations"
    values:
      layout: "default"
      diataxis_type: "explanation"
      nav_exclude: false
  - scope:
      path: ""
      type: "references"
    values:
      layout: "default"
      diataxis_type: "reference"
      nav_exclude: false
  # Blog posts
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Barrie Callender"

# jekyll-feed
feed:
  posts_limit: 20
  excerpt_only: true

# jekyll-seo-tag (author and social)
twitter:
  username: usingprimavera
  card: summary

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE.txt
  - vendor/
  - tmp/
  - ".github/"
  - "*.sh"
